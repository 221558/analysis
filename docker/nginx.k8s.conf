
user  root;
worker_processes  2;

error_log  /var/log/nginx/error.log warn;

pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # fix Web服务器HTTP设置漏洞(Web服务器HTTP头信息公开/默认的nginx HTTP服务器设置/Web服务器错误页面信息泄露)
    server_tokens off;
    # HTTP和HTTPS均需要的请求头
    # 因为要使用iframe嵌套页面，注释下列一行
    # add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection  "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    # 该行导致iframe图片不加载
    #add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)";
    add_header Referrer-Policy "no-referrer";
    add_header X-Download-Options "noopen";
    add_header X-Permitted-Cross-Domain-Policies "none";

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        off;
    #tcp_nopush     on;

    # 设置客户端发送请求体的超时时间为110秒
    client_body_timeout 110s;
    # 设置客户端发送请求头的超时时间为110秒
    client_header_timeout 110s;
    # 设置keep-alive超时时间为55秒，服务器在响应后保持连接55秒
    keepalive_timeout 55;

    # 定义一个共享内存区域用于存储每个客户端IP的连接数，共享区域命名perip
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    # 限制每个客户端IP的最大并发连接数为10
    limit_conn perip 10;

    # 定义一个共享内存区域用于存储每个客户端IP的请求速率，每秒5个，共享区域命名perip_req
    limit_req_zone $binary_remote_addr zone=perip_req:10m rate=5r/s;

    #gzip  on;

    #include /etc/nginx/conf.d/*.conf;

    # 设置允许客户端请求的最大 body 大小
    client_max_body_size 50M;

      # 设置 proxy_buffer_size，即每个请求的缓冲区大小
    proxy_buffer_size 500m;  # 同样，Nginx 中的缓冲区大小需要指定单位，如兆字节（m）

    # 设置 proxy_buffers_number，即分配给每个请求的缓冲区数量
    proxy_buffers 8 500m;  # 这里的第一个数字是缓冲区的数量，第二个参数是每个缓冲区的大小

    # 配置https
    server {
      #ssl监听443端口,http 端口80
      listen 80;
      server_name  ip-optical-frontend;

      # 使用nginx中定义的请求显示区域，允许客户端在速率限制基础上有 60 个额外的突发请求。
      limit_req zone=perip_req burst=60;

      # HTTP和HTTPS均需要的请求头
      # 因为要使用iframe嵌套页面，注释下列一行
      # add_header X-Frame-Options "DENY";
      add_header X-XSS-Protection  "1; mode=block";
      add_header X-Content-Type-Options "nosniff";
      # 该行导致iframe图片不加载
      # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";
      add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)";
      add_header Referrer-Policy "no-referrer";
      add_header X-Download-Options "noopen";
      add_header X-Permitted-Cross-Domain-Policies "none";

      #  HTTPS需要的请求头
      add_header Expect-CT "max-age=86400, enforce";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";


      # 开启 gzip 压缩
      gzip on;
      # 压缩响应的最小字节数
      gzip_min_length 1k;
      # 压缩级别，1（最快）到 9（最小）
      gzip_comp_level 5;
      gzip_types text/plain text/css text/xml application/javascript application/json;  # 指定压缩的 MIME 类型
  
      # 添加默认Cache-Control 头部
      add_header 'Cache-Control' 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
  
      location / {
        # 设置缓存最大时间，通常这里可以设置为较长时间
        expires 1d; 
        # 允许浏览器和CDN缓存内容
        add_header Cache-Control "public, max-age=86400"; 
        # 允许基于时间的验证
        if_modified_since before;
        try_files $uri $uri/ /index.html;
        # 开启ETag，有助于强验证缓存新鲜度
        etag on;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

      location ~* \.(css|js)$ {
          expires 1d;
          # 允许浏览器和CDN缓存内容
          add_header Cache-Control "public, max-age=86400"; 
          # 允许基于时间的验证
          if_modified_since before;
          # 开启ETag，有助于强验证缓存新鲜度
          etag on;
          root   /usr/share/nginx/html;
      }

      location ^~/api {
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_buffering off;
           rewrite ^/api/(.*)$ /$1 break;
           proxy_pass http://10.10.83.9:8081;
           proxy_connect_timeout 600;
           proxy_read_timeout 600;
      }

      # 禁用TRACR/TRACK
      if ($request_method ~* TRACE|TRACK|OPTIONS) {
                return 403;
      }
   
    }


}
